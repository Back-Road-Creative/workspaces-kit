name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e './tools/repo-ledger[test]'
      - name: Test
        run: python -m pytest -q tools/repo-ledger/tests tests
      - name: Catalog
        run: python tests/catalog_check.py

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build a wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" tools/repo-ledger
      - name: Install the wheel into a fresh environment and run the demo away from the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          mkdir "$RUNNER_TEMP/home" "$RUNNER_TEMP/elsewhere"
          cp examples/demo.sh examples/manifest.example.toml "$RUNNER_TEMP/elsewhere/"
          cd "$RUNNER_TEMP/elsewhere"
          env -i PATH="$RUNNER_TEMP/venv/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/home" \
            TMPDIR="$RUNNER_TEMP" bash ./demo.sh | tee demo.out
          grep -q 'branches with commits on no remote: experiment' demo.out
          grep -q 'installed: True | editable: False | module owned by distribution: True' demo.out
